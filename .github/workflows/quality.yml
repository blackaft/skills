name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Shell, data, and workflow checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate shell syntax
        shell: bash
        run: |
          find . -path './.git' -prune -o -type f -name '*.sh' -size +0c -print0 \
            | xargs -0 -r -n1 bash -n

      - name: Install ShellCheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends shellcheck
          fi

      - name: Run ShellCheck
        shell: bash
        run: |
          find . -path './.git' -prune -o -type f -name '*.sh' -size +0c -print0 \
            | xargs -0 -r shellcheck --severity=warning --exclude=SC2034,SC1090

      - name: Validate JSON
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if [ ! -s "$file" ]; then
              echo "::warning file=$file::Skipping empty JSON placeholder."
              continue
            fi
            python3 -m json.tool "$file" >/dev/null
          done < <(git ls-files -z '*.json')

      - name: Validate YAML
        shell: bash
        run: |
          ruby -ryaml -e 'ARGV.each { |file| YAML.load_file(file); puts file }' \
            $(git ls-files '*.yml' '*.yaml')

      - name: Set up Go for actionlint
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install actionlint
        shell: bash
        run: |
          actionlint_bin="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$actionlint_bin"
          GOBIN="$actionlint_bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.9
          echo "$actionlint_bin" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint
