      tags:
      - gh
      operationId: runGhAuth
      summary: Start browser-based GitHub CLI authentication.
      description: Runs gh auth login --web and waits for the user to complete browser validation.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GhAuthRequest"
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - gh
        - auth
        manifest: manifests/gh.json
        mutatesHost: true
        mutatesWorkspace: false
        promptsUnless:
        - "--yes"
        supportsDryRun: true
        requiresBrowserValidation: true
      responses:
        '200':
          description: Authentication completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResult"
        '400':
          description: Unsupported options.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '424':
          description: GitHub CLI is missing or auth was not completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/packages/gh/check":
    post:
      tags:
      - gh
      operationId: runGhCheck
      summary: Check GitHub CLI availability and authentication status.
      security: []
      requestBody:
