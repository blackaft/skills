components:
  schemas:
    SkillIndex:
      type: object
      required:
      - schema
      - eval
      - blackhost/
      properties:
        schema:
          type: object
          required:
          - name
          - version
          properties:
            name:
              type: string
              const: blackhost.skill
            version:
              type: string
              pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
          additionalProperties: false
        eval:
          type: object
          required:
          - path
          - summary
          - categories
          properties:
            path:
              type: string
              const: schemas/eval.json
            summary:
              type: string
            categories:
              type: array
              items:
                type: string
          additionalProperties: false
        blackhost/:
          type: object
      additionalProperties: true
    EvalContract:
      type: object
      required:
      - schema
      - summary
      - categories
      properties:
        schema:
          type: object
        summary:
          type: string
        categories:
          type: object
          required:
          - using_this_skill
          - updating_this_skill
      additionalProperties: true
    MaintainContract:
      type: object
      required:
      - schema
      - summary
      - process
      properties:
        schema:
          type: object
        summary:
          type: string
        process:
          type: array
          items:
            type: object
        package_change_loop:
          type: array
          items:
            type: string
        routing_contract:
          type: object
        output_contract:
          type: object
        assurance:
          type: object
      additionalProperties: true
    ManifestRef:
      type: object
      required:
      - name
      - path
      - summary
      properties:
        name:
          type: string
        path:
          type: string
        summary:
          type: string
      additionalProperties: false
    PackageManifest:
      type: object
      required:
      - script
      - summary
      - modules_dir
      - modules
      - commands
      - routing
      - dependencies
      - safety
      - notes
      properties:
        script:
          type: string
        summary:
          type: string
        modules_dir:
          type: string
        modules:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/Module"
        commands:
          type: object
          additionalProperties:
            "$ref": "#/components/schemas/Command"
        routing:
          "$ref": "#/components/schemas/Routing"
        dependencies:
          "$ref": "#/components/schemas/Dependencies"
        safety:
          "$ref": "#/components/schemas/Safety"
        notes:
          type: array
          items:
            type: string
      additionalProperties: false
    Module:
      type: object
      required:
      - path
      - summary
      - functions
      properties:
        path:
          type: string
        summary:
          type: string
        exports:
          type: array
          items:
            type: string
        configuration:
          type: array
          items:
            type: string
        functions:
          type: array
          items:
            type: string
            pattern: "^blackhost_[A-Za-z0-9_]+$"
      additionalProperties: false
    Command:
      type: object
      required:
      - run
      - summary
      - mutates_host
      properties:
        run:
          type: string
        summary:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
        outputs:
          type: array
          items:
            type: string
        packages:
          type: array
          items:
            type: string
        mutates_host:
          oneOf:
          - type: boolean
          - type: string
            enum:
            - package-dependent
            - command-dependent
        mutates_workspace:
          type: boolean
        supported_hosts:
          type: object
          additionalProperties:
            type: string
        expected_failure_when:
          type: array
          items:
            type: string
      additionalProperties: false
    Routing:
      type: object
      required:
      - grammar
      - packages
      properties:
        grammar:
          type: array
          items:
            type: string
        discovery:
          type: object
          additionalProperties:
            type: string
        packages:
          type: object
          additionalProperties:
            type: object
      additionalProperties: false
    Dependencies:
      type: object
      properties:
        required:
          type: array
          items:
            type: string
        optional:
          type: array
          items:
            type: string
        macos:
          type: array
          items:
            type: string
        debian_like_linux:
          type: array
          items:
            type: string
        compatibility:
          type: array
          items:
            type: string
      additionalProperties: false
    Safety:
      type: object
      required:
      - mutates_host
      - notes
      properties:
        mutates_host:
          oneOf:
          - type: boolean
          - type: string
            enum:
            - package-dependent
            - command-dependent
        notes:
          type: array
          items:
            type: string
      additionalProperties: false
    DockerCheckRequest:
      type: object
      properties:
        json:
          type: boolean
          default: false
          description: Maps to --json.
        'yes':
          type: boolean
          default: false
          description: Maps to --yes.
        verbose:
          type: boolean
