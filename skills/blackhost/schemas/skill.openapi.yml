        manifest.json: Reusable package manifest template.
        scripts/:
          auth.sh: Reusable package browser-authentication command template.
          check.sh: Reusable package readiness command template.
          install.sh: Reusable package installation command template.
          commons.sh: Reusable package commons helper template.
          run.sh: Reusable package run command template.
          update.sh: Reusable package update command template.
