---
openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Blackhost Skill
  summary: Local host setup and configuration harness for Blackaft workspaces.
  description: OpenAPI-style description of the blackhost local CLI surface. Operations are represented as local command invocations through vendor extensions because blackhost is not an HTTP service.
  version: 0.1.0
servers:
- url: blackhost://local
  description: Local shell execution boundary.
tags:
- name: aws
  description: AWS CLI checks, installation, updates, and SSO browser authentication.
- name: core
  description: Root router, host detection, shared helper loading, and package dispatch.
- name: docker
  description: Docker host checks, app scaffolding, local app runs, installation, updates, and diagnostics.
- name: git
  description: Git CLI checks, installation, updates, repository context, and identity diagnostics.
- name: gh
  description: GitHub CLI checks, installation, updates, and browser-based authentication.
- name: gcloud
  description: Google Cloud CLI checks, installation, updates, and browser-based authentication.
- name: homebrew
  description: Homebrew package-manager checks, installation, updates, and diagnostics.
- name: php
  description: PHP CLI, common PHP extensions, Composer checks, local app runs, installation, updates, and diagnostics.
- name: python
  description: Python 3, pip, virtual environment support, local static app runs, installation, updates, and diagnostics.
- name: yaml
  description: PyYAML checks, managed virtualenv installation, updates, and YAML parse runs for Python-backed tooling.
- name: node
  description: Node.js, npm, and npx checks, installation, and updates.
- name: metadata
  description: Skill and manifest discovery metadata.
paths:
  "/skill":
    get:
      tags:
      - metadata
      operationId: getBlackhostSkill
      summary: Read the blackhost skill index.
      description: Returns the lightweight skill index and file map.
      x-blackhost-command:
        entrypoint: null
        argv: []
        reads:
        - skill.json
        mutatesHost: false
      responses:
        '200':
          description: Skill metadata.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SkillIndex"
  "/manifests":
    get:
      tags:
      - metadata
      operationId: listBlackhostManifests
      summary: List known package manifests.
      x-blackhost-command:
        entrypoint: null
        argv: []
        reads:
        - manifests/core.json
        - manifests/docker.json
        - manifests/git.json
        - manifests/gh.json
        - manifests/php.json
        - manifests/python.json
        - manifests/yaml.json
        - manifests/node.json
        mutatesHost: false
      responses:
        '200':
          description: Known manifests.
          content:
            application/json:
              schema:
                type: object
                required:
                - manifests
                properties:
                  manifests:
                    type: array
                    items:
                      "$ref": "#/components/schemas/ManifestRef"
  "/eval":
    get:
      tags:
      - metadata
      operationId: getBlackhostEval
      summary: Read deterministic blackhost agent checks.
      description: Returns the rules and checks agents should use when using or updating this skill.
      x-blackhost-command:
        entrypoint: null
        argv: []
        reads:
        - schemas/eval.json
        mutatesHost: false
      responses:
        '200':
          description: Eval metadata.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EvalContract"
  "/maintain":
    get:
      tags:
      - metadata
      operationId: getBlackhostMaintain
      summary: Read deterministic blackhost maintenance process.
      description: Returns the ordered process agents should follow when changing this skill.
      x-blackhost-command:
        entrypoint: null
        argv: []
        reads:
        - schemas/maintain.json
        mutatesHost: false
      responses:
        '200':
          description: Maintenance metadata.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MaintainContract"
  "/manifests/{manifestName}":
    get:
      tags:
      - metadata
      operationId: getBlackhostManifest
      summary: Read one manifest.
      parameters:
      - name: manifestName
        in: path
        required: true
        schema:
          type: string
          enum:
          - aws
          - core
          - docker
          - gcloud
          - git
          - gh
          - homebrew
          - node
          - php
          - python
          - yaml
      x-blackhost-command:
        entrypoint: null
        argv: []
        reads:
        - manifests/{manifestName}.json
        mutatesHost: false
      responses:
        '200':
          description: Manifest contents.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PackageManifest"
        '404':
          description: Unknown manifest.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/commands/help":
    post:
      tags:
      - core
      operationId: runBlackhostHelp
      summary: Print the root blackhost command surface.
      security: []
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - "--help"
        mutatesHost: false
      responses:
        '200':
          description: Help text printed to stdout.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResult"
  "/commands/os":
    post:
      tags:
      - core
      operationId: runBlackhostOs
      summary: Print detected BLACKHOST_* host variables.
      security: []
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - os
        mutatesHost: false
        outputs:
        - BLACKHOST_OS
        - BLACKHOST_OS_FAMILY
        - BLACKHOST_OS_ID
        - BLACKHOST_OS_LIKE
        - BLACKHOST_OS_VERSION_CODENAME
        - BLACKHOST_OS_PRETTY
        - BLACKHOST_ARCH
      responses:
        '200':
          description: Detected host variables.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OsVariables"
  "/packages/docker/check":
    post:
      tags:
      - docker
      operationId: runDockerCheck
      summary: Check Docker CLI, daemon, Compose, Buildx, runtime smoke, and disk usage.
      description: Runs Docker readiness diagnostics. The command is host-read-only except that Docker may pull and run the hello-world image when the daemon is reachable.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DockerCheckRequest"
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - docker
        - check
        manifest: manifests/docker.json
        mutatesHost: false
        mayPullContainerImages: true
      responses:
        '200':
          description: Docker host is ready.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResult"
        '424':
          description: Docker host is not fully ready.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/packages/docker/install":
    post:
      tags:
      - docker
      operationId: runDockerInstall
      summary: Install Docker tooling with explicit prompts.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DockerInstallRequest"
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - docker
        - install
        manifest: manifests/docker.json
        mutatesHost: true
        promptsUnless:
        - "--yes"
        supportsDryRun: true
      responses:
        '200':
          description: Install path completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResult"
        '400':
          description: Unsupported options.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/packages/docker/dockerise":
    post:
      tags:
      - docker
      operationId: runDockerDockerise
      summary: Scaffold Docker deployment files for a target PHP/Apache or static/nginx app directory.
      description: Writes Docker scaffold files inside a target workspace directory. Refuses to overwrite existing generated files unless force is true.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DockeriseRequest"
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - docker
        - dockerise
        manifest: manifests/docker.json
        mutatesHost: false
        mutatesWorkspace: true
        promptsUnless:
        - "--yes"
        supportsDryRun: true
      responses:
        '200':
          description: Docker scaffold completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResult"
        '400':
          description: Unsupported options or invalid target.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '409':
          description: Generated file already exists and force was not enabled.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '501':
          description: Unsupported host operating system.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/packages/docker/run":
    post:
      tags:
      - docker
      operationId: runDockerRun
      summary: Build and run a Dockerised app locally.
      description: Builds a Docker image from a target app directory, replaces a same-name container after confirmation, starts the app on localhost, and optionally opens the browser.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DockerRunRequest"
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - docker
        - run
        manifest: manifests/docker.json
        mutatesHost: true
        mutatesWorkspace: false
        promptsUnless:
        - "--yes"
        supportsDryRun: true
        optionalHostMutation:
        - open browser
      responses:
        '200':
          description: Local app run completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResult"
        '400':
          description: Unsupported options or invalid target.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '424':
          description: Docker daemon is not reachable.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/packages/docker/update":
    post:
      tags:
      - docker
      operationId: runDockerUpdate
      summary: Update Docker tooling with explicit prompts.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DockerUpdateRequest"
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - docker
        - update
        manifest: manifests/docker.json
        mutatesHost: true
        promptsUnless:
        - "--yes"
        supportsDryRun: true
        optionalHostMutation:
        - docker system prune
      responses:
        '200':
          description: Update path completed.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CommandResult"
        '400':
          description: Unsupported options.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '501':
          description: Unsupported host operating system.
          content:
            application/json:
              schema:
