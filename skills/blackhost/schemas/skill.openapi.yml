  "/packages/aws/auth":
    post:
      tags:
      - aws
      operationId: runAwsAuth
      summary: Start AWS SSO browser authentication.
      description: Runs aws sso login or aws configure sso for the selected profile.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/AwsAuthRequest"
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
        - aws
