      operationId: runGcloudCheck
      summary: Check Google Cloud CLI availability and active authentication status.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GcloudCheckRequest"
      x-blackhost-command:
        entrypoint: scripts/core/init.sh
        argv:
