security: []
x-blackhost:
  schema:
    name: blackhost.skill.openapi
    version: 0.1.0
  entrypoint:
    path: scripts/core/init.sh
    run: scripts/core/init.sh [--json] <package> <command> [options]
  eval:
    path: schemas/eval.json
    summary: Deterministic checks and principles for using and updating the blackhost skill.
  maintain:
    path: schemas/maintain.json
    summary: Deterministic maintenance process for changing blackhost packages, routing, schemas, and assurance.
  assurance:
    dry: assurance/dry.sh
    eval: assurance/eval.sh
    log: assurance/log.txt
  local_index:
    json: local/index.json
    html: local/index.html
    template: templates/index.json
    url: http://localhost:8765/index.html
    server_pid: local/index-server.pid
    server_log: local/index-server.log
    auto_open: true
  manifests:
    aws:
      path: manifests/aws.json
      summary: AWS CLI package modules, SSO browser authentication, commands, options, supported hosts, and mutation boundaries.
    core:
      path: manifests/core.json
      summary: Core router, host detection, helper modules, root commands, routing grammar, and shared shell dependencies.
    docker:
      path: manifests/docker.json
      summary: Docker package modules, app scaffolding, local app runs, commands, options, supported hosts, and mutation boundaries.
    git:
      path: manifests/git.json
      summary: Git package modules, commands, options, supported hosts, repository context, and mutation boundaries.
    gh:
      path: manifests/gh.json
      summary: GitHub CLI package modules, browser authentication, commands, options, supported hosts, and mutation boundaries.
    gcloud:
      path: manifests/gcloud.json
      summary: Google Cloud CLI package modules, browser authentication, commands, options, supported hosts, and mutation boundaries.
    homebrew:
      path: manifests/homebrew.json
      summary: Homebrew package-manager modules, commands, options, supported hosts, and mutation boundaries.
    php:
      path: manifests/php.json
      summary: PHP package modules, Composer integration, local app runs, commands, options, supported hosts, and mutation boundaries.
    node:
      path: manifests/node.json
      summary: Node.js package modules, npm/npx integration, local app runs, commands, options, supported hosts, and mutation boundaries.
    python:
      path: manifests/python.json
      summary: Python package modules, pip integration, local static app runs, commands, options, supported hosts, and mutation boundaries.
    yaml:
      path: manifests/yaml.json
      summary: YAML package modules, managed-venv PyYAML integration, commands, options, supported hosts, and mutation boundaries.
  filesystem:
    blackhost/:
      README.md: Minimal human-facing skill overview.
      VERSION: Current blackhost skill release version.
      CHANGELOG.md: Versioned one-line release log with Version, User, LLM, and 240-character summary entries.
      LICENSE.md: PolyForm Shield License 1.0.0 with required Blackaft notice.
      local/:
        index.json: Generated local status cache.
        index.html: Generated static local status view with raw assurance/log.txt output at the bottom.
        index-server.pid: Generated local status HTTP server PID.
        index-server.log: Generated local status HTTP server log.
        .venv/: Generated managed Python virtualenv for blackhost-owned tooling.
      schemas/eval.json: Deterministic usage and update checks.
      schemas/maintain.json: Deterministic maintenance process.
      assurance/:
        dry.sh: Dry-run assurance runner.
        eval.sh: Top-level assurance runner.
        log.txt: Overwritten latest assurance run log.
      manifests/:
        aws.json: AWS CLI package manifest.
        core.json: Core package manifest.
        docker.json: Docker package manifest.
        gcloud.json: Google Cloud CLI package manifest.
        git.json: Git package manifest.
        gh.json: GitHub CLI package manifest.
        homebrew.json: Homebrew package-manager manifest.
        node.json: Node.js package manifest.
        php.json: PHP package manifest.
        python.json: Python package manifest.
        yaml.json: YAML package manifest.
      scripts/:
        aws/:
          auth.sh: AWS SSO browser authentication command implementation.
          check.sh: AWS CLI readiness command implementation.
          install.sh: AWS CLI installation command implementation.
          commons.sh: AWS CLI common helpers.
          update.sh: AWS CLI update command implementation.
        core/:
          helpers/: Shared router, terminal UX, OS detection, and temporary file helpers.
          init.sh: Root CLI entrypoint.
        docker/:
          check.sh: Docker readiness command implementation.
          dockerise.sh: Docker scaffold command implementation.
          install.sh: Docker installation command implementation.
          commons.sh: Docker common helpers for CLI availability, daemon reachability, Compose, Buildx, host guidance, and daemon waiting.
          run.sh: Docker local app build/run/open command implementation.
          update.sh: Docker update command implementation.
        git/:
          check.sh: Git readiness command implementation.
          install.sh: Git installation command implementation.
          commons.sh: Git common helpers.
          update.sh: Git update command implementation.
        gh/:
          auth.sh: GitHub CLI browser authentication command implementation.
          check.sh: GitHub CLI readiness command implementation.
          install.sh: GitHub CLI installation command implementation.
          commons.sh: GitHub CLI common helpers.
          update.sh: GitHub CLI update command implementation.
        gcloud/:
          auth.sh: Google Cloud CLI browser authentication command implementation.
          check.sh: Google Cloud CLI readiness command implementation.
          install.sh: Google Cloud CLI installation command implementation.
          commons.sh: Google Cloud CLI common helpers.
          update.sh: Google Cloud CLI update command implementation.
        homebrew/:
          check.sh: Homebrew readiness command implementation.
          install.sh: Homebrew installation command implementation.
          commons.sh: Homebrew common helpers.
          update.sh: Homebrew update command implementation.
        php/:
          check.sh: PHP readiness command implementation.
          install.sh: PHP and Composer installation command implementation.
          commons.sh: PHP and Composer common helpers.
          run.sh: PHP local app run command implementation.
          update.sh: PHP and Composer update command implementation.
        node/:
          check.sh: Node.js readiness command implementation.
          install.sh: Node.js installation command implementation.
          commons.sh: Node.js common helpers.
          run.sh: Node.js local app run command implementation.
          update.sh: Node.js update command implementation.
        python/:
